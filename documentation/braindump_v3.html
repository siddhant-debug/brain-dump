<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainDump</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: #060608;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 28px 16px 60px;
  gap: 20px;
}

/* ── Controls ── */
.controls { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.pill-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

.pill {
  padding: 5px 15px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.08);
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px; font-weight: 400;
  color: rgba(255,255,255,0.3);
  cursor: pointer; transition: all 0.2s; letter-spacing: 0.02em;
}
.pill.active { color: rgba(255,255,255,0.85); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); }
.pill.phase-pill.active { color: var(--phase-color, rgba(255,255,255,0.85)); border-color: var(--phase-border, rgba(255,255,255,0.2)); }

/* ── Device ── */
.device {
  width: 375px; min-height: 812px;
  border-radius: 50px; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
  position: relative;
  display: flex; flex-direction: column;
  box-shadow: 0 50px 120px rgba(0,0,0,0.85), 0 0 0 0.5px rgba(255,255,255,0.12) inset;
  flex-shrink: 0;
}

/* ── Notch ── */
.notch {
  width: 126px; height: 34px;
  border-radius: 0 0 20px 20px;
  margin: 0 auto;
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  z-index: 30;
}

/* ── Status ── */
.sb {
  padding: 14px 26px 2px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; font-weight: 500;
  position: relative; z-index: 10;
}

/* ── Nav ── */
.nav {
  padding: 10px 26px 14px;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid;
  position: relative; z-index: 10;
}
.greeting {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 26px; font-weight: 300; font-style: italic;
  letter-spacing: -0.01em; line-height: 1.2;
}
.greeting strong { font-weight: 400; font-style: normal; }
.nav-meta {
  display: flex; align-items: center; gap: 5px;
  margin-top: 5px; font-size: 10px;
}
.r-badge {
  padding: 2px 8px; border-radius: 20px;
  font-size: 9px; font-weight: 500;
  letter-spacing: 0.03em;
}
.nav-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }

/* ── Body ── */
.body {
  flex: 1; overflow-y: auto; padding: 0 0 110px;
}
.body::-webkit-scrollbar { display: none; }

/* ── Section header ── */
.s-head {
  font-size: 9px; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 20px 26px 8px;
  display: flex; justify-content: space-between; align-items: center;
}

/* ── Live strip — NO boxes, just inline pills ── */
.live-strip {
  display: flex; gap: 6px; flex-wrap: wrap;
  padding: 0 26px 4px;
}
.live-pill {
  display: flex; align-items: center; gap: 4px;
  font-size: 11px; padding: 4px 10px; border-radius: 20px;
  border: 0.5px solid; font-weight: 400;
  white-space: nowrap;
}
.live-pill-icon { font-size: 11px; }

/* ── Readiness row — flat, no card ── */
.readiness-row {
  padding: 12px 26px 0;
  display: flex; align-items: flex-end; justify-content: space-between;
}
.r-score-big { font-size: 48px; font-weight: 300; line-height: 1; letter-spacing: -0.03em; }
.r-score-label { font-size: 11px; font-weight: 400; margin-bottom: 4px; }
.r-bars { display: flex; flex-direction: column; gap: 7px; width: 160px; }
.r-bar { display: flex; flex-direction: column; gap: 3px; }
.r-bar-top { display: flex; justify-content: space-between; font-size: 9px; }
.r-bar-track { height: 2px; border-radius: 1px; background: rgba(255,255,255,0.07); }
.r-bar-fill { height: 2px; border-radius: 1px; transition: width 0.7s ease; }
.r-insight {
  padding: 10px 26px 0; font-size: 11px; line-height: 1.6;
  font-style: italic; font-family: 'Crimson Pro', serif;
  font-weight: 300;
}

/* ── Divider ── */
.div { height: 0.5px; margin: 20px 26px 0; }

/* ── Gita quote — no box, pure typography ── */
.gita-wrap { padding: 20px 26px 4px; }
.gita-sanskrit {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 15px; font-weight: 300; font-style: italic;
  line-height: 1.7; letter-spacing: 0.01em;
  margin-bottom: 8px;
}
.gita-english {
  font-size: 12px; font-weight: 300; line-height: 1.65;
  margin-bottom: 4px;
}
.gita-hindi {
  font-size: 11px; font-weight: 300; line-height: 1.6;
  opacity: 0.5;
}
.gita-source { font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 8px; opacity: 0.3; }

/* ── Path — minimal, no card backgrounds ── */
.path-wrap { padding: 0 26px; }
.path-goal-label { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.3; margin-bottom: 4px; }
.path-goal-text {
  font-family: 'Crimson Pro', serif;
  font-size: 16px; font-weight: 300; font-style: italic;
  line-height: 1.4; margin-bottom: 4px;
}
.path-pct { font-size: 10px; font-weight: 500; opacity: 0.4; margin-bottom: 16px; }

.tl { position: relative; padding-left: 18px; }
.tl-line { position: absolute; left: 4px; top: 8px; bottom: 8px; width: 1px; }

.tl-item { position: relative; margin-bottom: 12px; }
.tl-dot { width: 8px; height: 8px; border-radius: 50%; position: absolute; left: -16px; top: 5px; border: 1px solid; }
.tl-dot.goal { width: 11px; height: 11px; left: -17.5px; top: 3px; }
.tl-dot.dim { opacity: 0.3; }

.tl-title { font-size: 12px; font-weight: 400; line-height: 1.3; margin-bottom: 2px; }
.tl-sub { font-size: 10px; line-height: 1.5; opacity: 0.45; }
.tl-tag {
  display: inline-block; margin-top: 5px; margin-right: 4px;
  font-size: 9px; padding: 2px 7px; border-radius: 10px;
}

/* ── Omni ── */
.omni-wrap { padding: 0 20px; margin-top: 20px; }
.omni {
  border-radius: 16px; padding: 13px 16px;
  display: flex; align-items: center; gap: 10px;
  border: 0.5px solid; cursor: text;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
.omni-text { flex: 1; font-size: 13px; font-style: italic; font-family: 'Crimson Pro', serif; font-weight: 300; }
.omni-btn {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0; border: 0.5px solid;
}

/* ── Dump cards — ultra minimal ── */
.dump-wrap { padding: 0 26px; display: flex; flex-direction: column; gap: 16px; }
.dump-item { border-left: 1px solid; padding-left: 14px; }
.dump-text { font-size: 12px; font-weight: 300; line-height: 1.65; margin-bottom: 6px; }
.dump-tags { display: flex; gap: 8px; flex-wrap: wrap; }
.dump-tag { font-size: 9px; opacity: 0.35; }

/* ── Vault ── */
.vault-wrap { padding: 0 20px; }
.v-search {
  width: 100%; padding: 11px 15px; border-radius: 13px;
  border: 0.5px solid; font-family: 'DM Sans', sans-serif;
  font-size: 12px; outline: none; margin-bottom: 16px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.v-file {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: 12px;
  border: 0.5px solid; margin-bottom: 8px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.v-icon {
  width: 30px; height: 34px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 600; flex-shrink: 0; letter-spacing: 0.03em;
}
.v-name { font-size: 11px; font-weight: 400; }
.v-meta { font-size: 9px; opacity: 0.35; margin-top: 2px; }

/* ── Ask — magic UI ── */
.ask-wrap { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
.ask-context-bar {
  display: flex; gap: 5px; flex-wrap: wrap;
  padding: 10px 14px; border-radius: 12px;
  border: 0.5px solid; margin-bottom: 4px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.ctx-item { font-size: 9px; display: flex; align-items: center; gap: 3px; }
.ctx-dot { width: 4px; height: 4px; border-radius: 50%; display: inline-block; }

.msg-row { display: flex; flex-direction: column; gap: 2px; }
.msg-user { align-self: flex-end; }
.bubble {
  display: inline-block; padding: 9px 13px;
  border-radius: 14px; font-size: 12px; line-height: 1.55;
  max-width: 90%; font-weight: 300;
}
.bubble-ai-wrap { display: flex; gap: 8px; align-items: flex-start; }
.b-avatar {
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 500; flex-shrink: 0; margin-top: 2px;
}
.b-src { font-size: 8px; opacity: 0.3; margin-top: 3px; letter-spacing: 0.02em; }

/* memory sparks — the magic dots ── */
.memory-sparks { display: flex; gap: 4px; align-items: center; margin-top: 6px; }
.spark { width: 16px; height: 3px; border-radius: 2px; opacity: 0.5; }
.spark-label { font-size: 8px; opacity: 0.3; margin-left: 2px; }

.ask-input-row {
  display: flex; gap: 8px; align-items: center;
  padding-top: 4px;
}
.ask-input {
  flex: 1; border-radius: 12px; padding: 10px 14px;
  border: 0.5px solid; font-size: 12px;
  font-family: 'DM Sans', sans-serif; outline: none;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.ask-send {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0; border: 0.5px solid; cursor: pointer;
}

/* ── Tab bar ── */
.tabs {
  position: sticky; bottom: 0; z-index: 50;
  display: flex; padding: 9px 20px 26px; gap: 2px;
  border-top: 0.5px solid;
  backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
}
.tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 3px; padding: 5px 4px;
  border-radius: 10px; cursor: pointer;
  opacity: 0.3; transition: opacity 0.15s;
}
.tab.on { opacity: 1; }
.tab-ic { font-size: 17px; }
.tab-lb { font-size: 8px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 500; }
</style>
</head>
<body>

<div class="controls">
  <div class="pill-row" id="phases"></div>
  <div class="pill-row" id="pages"></div>
</div>

<div class="device" id="device">
  <div class="notch" id="notch"></div>
  <div class="sb" id="sb"></div>
  <div class="nav" id="nav"></div>
  <div class="body" id="body"></div>
  <div class="tabs" id="tabs"></div>
</div>

<script>
/* ── Gita quotes ── */
const GITA = [
  {
    sk: 'कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।\nमा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि॥',
    en: 'You have a right to perform your prescribed duties, but you are not entitled to the fruits of your actions.',
    hi: 'कर्म करो, फल की चिंता मत करो।',
    ref: 'Bhagavad Gita · 2.47'
  },
  {
    sk: 'योगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय।\nसिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते॥',
    en: 'Be steadfast in yoga, O Arjuna. Perform your duty and abandon all attachment to success or failure. Such evenness of mind is called yoga.',
    hi: 'समभाव में स्थिर होकर कर्म करो — यही योग है।',

  {

    en: 'The soul can never be cut into pieces by any weapon, nor burned by fire, nor moistened by water, nor withered by the wind.',
    hi: 'आत्मा अजर, अमर और अविनाशी है।',
    ref: 'Bhagavad Gita · 2.23'
  },
  {
    sk: 'श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात्।\nस्वधर्मे निधनं श्रेयः परधर्मो भयावहः॥',
    en: 'It is better to perform one\'s own duties imperfectly than to master the duties of another. Better to die in one\'s own dharma than in the dharma of another.',

    en: 'Whenever righteousness wanes and unrighteousness increases, I manifest myself on earth.',
    hi: 'जब-जब धर्म की हानि होती है, मैं स्वयं प्रकट होता हूँ।',
    ref: 'Bhagavad Gita · 4.7'
  },
  {
    sk: 'सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज।\nअहं त्वां सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः॥',
    en: 'Abandon all varieties of dharma and simply surrender unto me alone. I shall liberate you from all sinful reactions; do not fear.',
    hi: 'सब धर्म छोड़कर केवल मेरी शरण में आ जा — मैं तुझे मुक्त करूँगा।',

/* ── Phase data ── */

const PAGES = [{id:'home',ic:'⌂',lb:'home'},{id:'vault',ic:'◈',lb:'vault'},{id:'ask',ic:'✦',lb:'ask'}];

let phase = 'night', page = 'home';
let gitaIdx = Math.floor(Math.random() * GITA.length);

/* ── Build controls ── */
const phaseEl = document.getElementById('phases');
Object.values(P).forEach(p => {
  const b = document.createElement('button');
  b.className = 'pill phase-pill' + (p.id === phase ? ' active' : '');
  b.textContent = p.label;
  b.style.setProperty('--phase-color', p.phaseColor);
  b.style.setProperty('--phase-border', p.phaseColor + '60');
  b.onclick = () => {
    phase = p.id;
    phaseEl.querySelectorAll('.pill').forEach((x,i) => {
      const pid = Object.keys(P)[i];
      x.className = 'pill phase-pill' + (pid === phase ? ' active' : '');
    });
    render();
  };
  phaseEl.appendChild(b);
});

const pageEl = document.getElementById('pages');
PAGES.forEach(pg => {
  const b = document.createElement('button');
  b.className = 'pill' + (pg.id === page ? ' active' : '');
  b.textContent = pg.lb;
  b.onclick = () => {
    page = pg.id;
    pageEl.querySelectorAll('.pill').forEach((x,i) => { x.className = 'pill' + (PAGES[i].id === page ? ' active' : ''); });
    render();
  };
  pageEl.appendChild(b);
});

/* ── Render ── */
function render() {
  const ph = P[phase];
  const gita = GITA[gitaIdx];
  const device = document.getElementById('device');
  device.style.background = ph.bg;
  document.getElementById('notch').style.background = ph.notch;

  // status
  document.getElementById('sb').style.cssText = `padding:14px 26px 2px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:500;color:${ph.text};position:relative;z-index:10;`;
  document.getElementById('sb').innerHTML = `<span>${ph.time}</span><span style="opacity:0.5">●●● ${ph.bat}</span>`;

  // nav
  const nav = document.getElementById('nav');
  nav.style.cssText = `padding:10px 26px 14px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:0.5px solid ${ph.border};background:${ph.navBg};position:relative;z-index:10;`;
  nav.innerHTML = `
    <div class="greeting" style="color:${ph.text}">${ph.greet} <strong>${ph.name}</strong></div>
    <div class="nav-meta">
      <span class="nav-dot" style="background:${ph.rDot}"></span>
      <span style="color:${ph.textF};font-size:10px">${ph.phase}</span>
      <span style="color:${ph.textF};font-size:10px;opacity:0.4">·</span>
      <span class="r-badge" style="background:${ph.rBg};color:${ph.rColor}">${ph.rLabel} readiness</span>
      <span style="color:${ph.textF};font-size:10px;opacity:0.4">·</span>
      <span style="color:${ph.textF};font-size:10px">${ph.bpm} bpm</span>
    </div>`;

  // body
  const body = document.getElementById('body');
  if (page === 'home') body.innerHTML = homeHTML(ph, gita);
  else if (page === 'vault') body.innerHTML = vaultHTML(ph);
  else body.innerHTML = askHTML(ph);

  // tabs
  const tabs = document.getElementById('tabs');
  tabs.style.cssText = `position:sticky;bottom:0;z-index:50;display:flex;padding:9px 20px 26px;gap:2px;border-top:0.5px solid ${ph.border};background:${ph.tabBg};backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);`;
  tabs.innerHTML = PAGES.map(pg => `
    <div class="tab ${pg.id===page?'on':''}" style="color:${pg.id===page?ph.tabOn:ph.textF};${pg.id===page?`background:${ph.accentBg}`:''}" onclick="page='${pg.id}';pageEl.querySelectorAll('.pill').forEach((x,i)=>{x.className='pill'+(PAGES[i].id===page?'  active':'');});render()">
      <span class="tab-ic">${pg.ic}</span>
      <span class="tab-lb">${pg.lb}</span>
    </div>`).join('');
}
