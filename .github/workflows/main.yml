name: Deploy to Server

on:
  push:
    branches:
      - deployment

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy to Server natively
        run: |
          # 1. Navigate to the root project directory on the runner's server
          cd /home/sidtom/application/projects/brain-dump
          
          echo "Pulling latest code..."
          git pull origin deployment

          # 2. Navigate into the backend directory
          cd backend
          
          # Note: This assumes your .env file is already present at /home/sidtom/application/projects/brain-dump/backend/.env
          # and you are securely maintaining it on the server directly.
          
          echo "Rebuilding and restarting backend..."
          docker compose up -d --build --no-deps braindump-backend
          
          echo "Cleaning up old images..."
          docker image prune -f
          
          echo "Deployment complete!"
