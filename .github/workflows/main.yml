name: Deploy to Server

on:
  push:
    branches:
      - deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Unix server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          # Pass the GitHub Secret into the SSH environment
          envs: ENV_FILE_CONTENT
          env:
            ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
          script: |
            # 1. Navigate to the root project directory
            cd /home/sidtom/application/projects/brain-dump
            
            echo "Pulling latest code..."
            git pull origin deployment

            # 2. Navigate into the backend directory
            cd backend
            
            echo "Updating .env file..."
            # Write the contents of the GitHub Secret to the .env file
            echo "$ENV_FILE_CONTENT" > .env

            echo "Rebuilding and restarting backend..."
            # Restart only the backend service and rebuild its image
            sudo docker compose up -d --build --no-deps braindump-backend

            echo "Cleaning up old images..."
            sudo docker image prune -f

            echo "Deployment complete!"
