version: '3.8'

services:
  # The FastAPI Python App
  braindump-backend:
    build: .
    container_name: braindump-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Override the local host to point to the docker postgres service
      - DATABASE_URL=postgresql+psycopg://postgres:password123@postgres/postgres
    env_file:
      - .env
    volumes:
      # Mount ChromaDB storage and the upload vault
      - ./brain_storage:/brain_storage
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # The Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: braindump-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: postgres
    ports:
      # Exposing on 5433 to avoid conflict with local Mac Postgres on 5432
      - "5433:5432"
    volumes:
      # Save the Postgres data locally so it survives container restarts
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
