name: brain_dump
description: "A minimalist brain-dump & query app."
publish_to: 'none'
version: 1.0.0+11

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  font_awesome_flutter: ^10.8.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.5.0
  google_sign_in: ^6.1.5
  dio: ^5.3.3
  flutter_secure_storage: ^9.0.0
  flutter_markdown: ^0.7.3+1
  syncfusion_flutter_pdfviewer: ^32.2.7
  flutter_animate: ^4.5.2
  google_fonts: ^8.0.1
  uuid: ^4.5.2
  intl: ^0.19.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  music_kit: ^1.3.0
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4

flutter:
  uses-material-design: true
  assets:
    - .env
